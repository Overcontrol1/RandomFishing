pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
		maven { url = "https://maven.kikugie.dev/releases"}
	}
}

plugins {
	id "dev.kikugie.stonecutter" version "0.5.1"
}

stonecutter {
	create(rootProject) {
		versions "1.20.1", "1.20.4", "1.21.1"
	}
}